<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b12">
<title>记忆巡游 · 序章</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d0b12;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;
    -webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#0d0b12;}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0d0b12;color:#e8dcc0;font:600 15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;z-index:9}
  #boot .t{letter-spacing:.28em;font-size:13px;opacity:.75}
  #bar{width:210px;height:5px;background:#241f2e;border-radius:3px;overflow:hidden;margin-top:16px}
  #fill{height:100%;width:0;background:#8fb07a;transition:width .12s linear}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(9,7,14,.9);color:#f6eed6;z-index:30;pointer-events:none;
    font:600 15px/1.8 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;text-align:center;letter-spacing:.08em}
  @media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} }  #err{position:fixed;left:0;right:0;bottom:0;color:#ff9b9b;font:12px/1.5 monospace;
    background:#1a0d0d;padding:8px;white-space:pre-wrap;z-index:20;display:none}
</style>

<style id="m-touch">
  html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="boot"><div class="t">记忆巡游</div><div id="bar"><div id="fill"></div></div></div>
<div id="rotate">把手机横过来 ◻↔◻</div>
<pre id="err"></pre>
<script>
window.__err = [];
window.onerror = function(m, s, l, c){
  window.__err.push(m + ' @' + (s||'') + ':' + l + ':' + c);
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = window.__err.join('\n');
};
</script>
<script src="game.js"></script>
</body>
</html>
